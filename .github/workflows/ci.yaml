name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types and unused code
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # packageManager の pnpm と Node を入れ、`pnpm install --frozen-lockfile`
      # まで行う。package.json に devEngines.runtime が無いので Node はここで決める。
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm run check
      # ルートの typecheck は全ワークスペースの typecheck を回す（preview は panda codegen 込み）。
      - run: pnpm run typecheck
      - run: pnpm run knip

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      # 設定に projects が無いのでブラウザは Chromium だけ。`--with-deps` は
      # 実行に要る apt の依存（libnss3 など）を入れる。
      - name: Install Playwright browsers
        working-directory: packages/preview
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      # 失敗したときのレポート（トレースを開ける）を残す。成功時は要らない。
      # actions/upload-artifact v5.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: packages/preview/playwright-report/
          retention-days: 7
